name: CI

# Los checks corren en todo push y PR; el deploy solo cuando main ya pasó los
# checks, o a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API — lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen de desarrollo
        # El target `dev` es el que trae ruff, mypy y pytest. Construirla aquí
        # también valida el Dockerfile en cada push, no solo al desplegar.
        run: docker build --target dev -t accounting-api:dev ./api

      - name: Ruff
        run: docker run --rm accounting-api:dev ruff check .

      - name: Mypy
        run: docker run --rm accounting-api:dev mypy .

      - name: Pytest
        # Los tests usan SQLite en memoria, así que no necesitan Postgres.
        run: docker run --rm accounting-api:dev pytest -q

  web:
    name: Web — lint, tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen de desarrollo
        run: docker build --target dev -t accounting-web:dev ./web

      - name: ESLint
        run: docker run --rm accounting-web:dev npm run lint

      - name: Typecheck
        run: docker run --rm accounting-web:dev npm run typecheck

      - name: Build de producción
        # Compila el target `prod` entero: si el standalone output se rompe, se
        # ve aquí y no en el servidor.
        run: docker build --target prod -t accounting-web:prod ./web

  images:
    name: Publicar imágenes en GHCR
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir y publicar ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          target: prod
          push: true
          # El servidor despliega por SHA; `latest` queda para un deploy manual.
          tags: |
            ghcr.io/camiloarias12/accounting-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/camiloarias12/accounting-${{ matrix.component }}:latest
          # Caché en el propio registro: el runner es efímero y sin esto cada
          # push reconstruye node_modules y el venv desde cero.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en producción
    needs: [api, web, images]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Dos deploys simultáneos dejarían el servidor a medio construir.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay servidor configurado?
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Sin secrets no hay a dónde desplegar. Se sale en verde en vez de en
          # rojo: el pipeline no está roto, simplemente todavía no se corrió
          # scripts/setup-github-deploy.sh.
          if [ -z "$DEPLOY_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::notice::Deploy omitido: faltan los secrets DEPLOY_HOST y SSH_PRIVATE_KEY (ver scripts/setup-github-deploy.sh)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar la clave SSH
        if: steps.check.outputs.configured == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Con el secret puesto, la identidad del servidor queda fijada y un
          # secuestro de la IP no recibe el deploy. Sin él, se acepta la que
          # anuncie el host (confianza al primer uso) para no exigir un paso
          # manual: el pipeline funciona igual, con menos garantía.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS vacío; se acepta la clave del host sin verificar"
            ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Aprovisionar el servidor
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          # Idempotente: instala Docker y genera el .env solo la primera vez.
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_HOST=$DEPLOY_HOST bash -s" < scripts/provision.sh

      - name: Login del servidor en GHCR
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          # Por stdin: pasado como argumento, el token quedaría visible en un
          # `ps` del servidor mientras dura el comando.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Desplegar
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          # El script vive en el repo, versionado, y se ejecuta por stdin: el
          # servidor no necesita tener una copia previa ni mantenerla al día.
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_SHA=${{ github.sha }} IMAGE_TAG=${{ github.sha }} bash -s" < scripts/deploy.sh

      - name: Cerrar sesión del registro
        # Siempre, incluso si el deploy falló: no dejamos credenciales en
        # ~/.docker/config.json de una máquina compartida.
        if: always() && steps.check.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true
