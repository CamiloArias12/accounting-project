# Configuración de DESARROLLO. Compose la aplica sola sobre docker-compose.yml.
#
# Diferencias con prod: targets `dev` de cada Dockerfile, código montado para
# hot reload, y Postgres/Redis expuestos en el host para poder conectarse con
# un cliente externo.
#
# Para levantar prod hay que excluirla explícitamente:
#   docker compose -f docker-compose.yml up -d

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    image: accounting-api:dev
    build:
      target: dev
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
    volumes:
      # El volumen anónimo evita que el bind mount tape el venv de la imagen.
      - ./api:/app
      - /app/.venv

  web:
    image: accounting-web:dev
    build:
      target: dev
    environment:
      API_URL: http://api:8000
    volumes:
      # Los volúmenes anónimos protegen node_modules y .next del bind mount.
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_started
