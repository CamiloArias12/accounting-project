# Ajustes del servidor compartido 46.224.38.172, que NO es exclusivo de este
# proyecto: ahí vive jorgedarek-app en producción (Swarm), con su propio
# Postgres y Redis y un nginx-proxy-manager dueño de los puertos 80 y 443.
#
# Se aplica encima de la base:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Dos diferencias con la base, ambas por convivencia:
#
# 1. Las imágenes vienen del registro, no se construyen aquí. El servidor tiene
#    3.7 GB de RAM y 5 GB de disco libres: un `next build` puede disparar el
#    OOM killer o llenar el disco, y el que se cae entonces es el Postgres del
#    otro proyecto.
# 2. La web se engancha además a la red `proxy` (overlay de Swarm, attachable),
#    para que nginx-proxy-manager pueda enrutarle un subdominio por nombre de
#    contenedor sin publicar nada más al exterior.

services:
  api:
    image: ghcr.io/camiloarias12/accounting-api:${IMAGE_TAG:-latest}
    # `missing` en lugar de `always`: si la imagen ya está (por CI o por un
    # `docker load` manual), no sale a la red a buscarla.
    pull_policy: missing

  web:
    image: ghcr.io/camiloarias12/accounting-web:${IMAGE_TAG:-latest}
    pull_policy: missing
    environment:
      # No `http://api:8000` aquí. Al entrar en la red `proxy` compartimos el
      # espacio de nombres con el otro proyecto, que ya tiene un servicio
      # llamado `api`: el nombre corto resuelve al suyo y la web se queda sin
      # backend. El nombre del contenedor sí es único en las dos redes.
      API_URL: http://accounting-api:8000
    networks:
      # `default` hay que repetirlo: al declarar redes se pierde la implícita,
      # y sin ella la web no vería a la API.
      - default
      - proxy

networks:
  proxy:
    external: true
