# Configuración base = PRODUCCIÓN.
#
# Compose carga docker-compose.override.yml automáticamente, que reconfigura
# todo para desarrollo (hot reload). Por eso:
#
#   docker compose up -d                        -> dev
#   docker compose -f docker-compose.yml up -d  -> prod
#
# `name` explícito: sin esto Compose lo deduce del directorio y puede recrear
# los contenedores de otro proyecto que se llame igual.
name: accounting

services:
  postgres:
    container_name: accounting-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: accounting-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: accounting-api
    # Tag distinto al de dev: si ambos modos comparten tag, un `up` sin --build
    # reutiliza silenciosamente la imagen del otro modo.
    image: accounting-api:prod
    build:
      context: ./api
      target: prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    container_name: accounting-web
    image: accounting-web:prod
    build:
      context: ./web
      target: prod
    restart: unless-stopped
    environment:
      # La web habla con la API solo desde el servidor, por el nombre de
      # servicio de Compose. Al no ser NEXT_PUBLIC_* se lee en runtime, así que
      # cambiarla no obliga a reconstruir la imagen.
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
